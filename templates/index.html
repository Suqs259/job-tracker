<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>校招投递管理台</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>校招投递管理台</h1>
      <p class="muted">记录每一次投递，看清每一步转化</p>
    </div>
    <div class="topbar-right">
      <span class="muted" id="current-user">{{ username }}</span>
      <button class="btn btn-primary" id="btn-create">+ 新增投递</button>
      <button class="btn" id="btn-logout">退出</button>
    </div>
  </header>

  <main>
    <section class="cards">
      <div class="card">
        <span class="card-label">总投递</span>
        <strong class="card-value" id="stat-total">0</strong>
      </div>
      <div class="card">
        <span class="card-label">进入笔面</span>
        <strong class="card-value" id="stat-interview">0</strong>
        <span class="card-hint" id="stat-interview-rate">转化率 0%</span>
      </div>
      <div class="card">
        <span class="card-label">Offer</span>
        <strong class="card-value" id="stat-offer">0</strong>
        <span class="card-hint" id="stat-offer-rate">转化率 0%</span>
      </div>
      <div class="card">
        <span class="card-label">进行中</span>
        <strong class="card-value" id="stat-active">0</strong>
        <span class="card-hint">不含已挂与 Offer</span>
      </div>
    </section>

    <section class="charts">
      <div class="panel">
        <h2>各阶段人数</h2>
        <div class="chart-box"><canvas id="chart-status"></canvas></div>
      </div>
      <div class="panel">
        <h2>投递渠道分布</h2>
        <div class="chart-box"><canvas id="chart-channel"></canvas></div>
      </div>
    </section>

    <section class="panel">
      <div class="toolbar">
        <input type="search" id="search" placeholder="搜索公司 / 岗位 / 备注">
        <select id="filter-status">
          <option value="">全部状态</option>
          {% for status in statuses %}
          <option value="{{ status }}">{{ status }}</option>
          {% endfor %}
        </select>
        <span class="muted" id="list-count">共 0 条</span>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>公司</th>
              <th>岗位</th>
              <th>城市</th>
              <th>渠道</th>
              <th>投递日期</th>
              <th>状态</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
        <p class="empty" id="empty-hint" hidden>还没有记录，点右上角「新增投递」开始吧</p>
      </div>

      <div class="pager" id="pager" hidden>
        <button class="btn" id="btn-prev" type="button">上一页</button>
        <span class="muted" id="page-info">第 1 / 1 页</span>
        <button class="btn" id="btn-next" type="button">下一页</button>
      </div>
    </section>
  </main>

  <dialog id="form-dialog">
    <form id="record-form" method="dialog">
      <h2 id="dialog-title">新增投递</h2>
      <input type="hidden" id="record-id">

      <div class="form-grid">
        <label>公司 <span class="req">*</span>
          <input type="text" id="f-company" required maxlength="50" placeholder="如：新意科技">
        </label>
        <label>岗位 <span class="req">*</span>
          <input type="text" id="f-position" required maxlength="50" placeholder="如：技术支持工程师">
        </label>
        <label>城市
          <input type="text" id="f-city" maxlength="20" placeholder="如：桂林 / 深圳">
        </label>
        <label>渠道
          <input type="text" id="f-channel" maxlength="20" list="channel-options" placeholder="如：官网 / BOSS">
          <datalist id="channel-options">
            <option value="官网"><option value="BOSS直聘"><option value="牛客">
            <option value="内推"><option value="实习僧"><option value="校园宣讲">
          </datalist>
        </label>
        <label>薪资
          <input type="text" id="f-salary" maxlength="30" placeholder="如：8-12K">
        </label>
        <label>投递日期 <span class="req">*</span>
          <input type="date" id="f-apply-date" required>
        </label>
        <label>状态
          <select id="f-status">
            {% for status in statuses %}
            <option value="{{ status }}">{{ status }}</option>
            {% endfor %}
          </select>
        </label>
        <label>JD 链接
          <input type="url" id="f-jd-url" maxlength="300" placeholder="https://...">
        </label>
        <label class="span-2">备注
          <textarea id="f-note" rows="3" maxlength="500" placeholder="面试问题、复盘、联系人..."></textarea>
        </label>
      </div>

      <p class="form-error" id="form-error" hidden></p>

      <div class="dialog-actions">
        <button type="button" class="btn" id="btn-cancel">取消</button>
        <button type="submit" class="btn btn-primary" id="btn-save">保存</button>
      </div>
    </form>
  </dialog>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
